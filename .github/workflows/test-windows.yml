# Builds only the Windows x64 Throne.exe for the test branch.
# The release package links Qt statically, so the artifact is a drop-in replacement for an installed Throne.exe.
name: Test Windows build
on:
  push:
    branches:
      - test
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      QT_VERSION: "6.11.2"
      ARCH: x64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Same key as build.yml so both workflows share the compiler cache.
      - name: Setup compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-amd64-${{ env.QT_VERSION }}
          variant: sccache
          max-size: 500M
      - name: Cache Qt and OpenSSL
        id: cache-winqt
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ env.QT_VERSION }}-${{ env.ARCH }}
      - name: Download Qt and OpenSSL
        if: steps.cache-winqt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${QT_VERSION}/Qt_${QT_VERSION}_${ARCH}.7z
          curl -fL -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${ARCH}.7z
      - name: Generate MakeFile and Build
        shell: bash
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ..
          ninja
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-test-${{ github.sha }}-windows-amd64
          path: |
            build/Throne.exe
            build/Throne.pdb
          if-no-files-found: error
